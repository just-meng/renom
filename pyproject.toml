[project]
name = "rename-tool"
version = "0.1.0"
description = "Batch rename utility with regex, prefix/suffix, and number increment modes."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rename = "rename_tool:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rename_tool"]
