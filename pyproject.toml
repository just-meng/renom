[project]
name = "renom"
version = "0.1.0"
description = "Batch rename utility with regex, prefix/suffix, and number increment modes."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
renom = "renom:main"
# Legacy alias: keeps `datalad rerun` of old run records (`rename {inputs} ...`) working.
rename = "renom:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/renom"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
